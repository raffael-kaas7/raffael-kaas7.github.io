<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Raffael Kaas - Blog</title>
  <meta name="description" content="This legacy blog URL has moved to the static article archive.">
  <meta name="author" content="Raffael Kaas">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var post = params.get("post");
      var target = "/blog/";

      if (post && /^[a-z0-9-]+$/.test(post)) {
        target = "/blog/" + post + "/";
      }

      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Raffael Kaas - Blog</h1>
    <p>This blog page has moved to <a href="/blog/">the article archive</a>.</p>
  </main>
</body>
</html>
