name: Build and publish website

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Refresh and deploy every Monday, Wednesday and Friday at 05:17 UTC.
    - cron: '17 5 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check stats rendering and snapshot updates
        run: npm test
      - name: Refresh training statistics
        env:
          LIFTLYTICS_URL: ${{ vars.LIFTLYTICS_URL || 'https://liftlytics.de' }}
          LIFTLYTICS_EXERCISE_IDS: ${{ vars.LIFTLYTICS_EXERCISE_IDS }}
          LIFTLYTICS_API_TOKEN: ${{ secrets.LIFTLYTICS_API_TOKEN }}
        run: npm run stats:refresh
      - name: Build website
        run: npm run build:pages
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
